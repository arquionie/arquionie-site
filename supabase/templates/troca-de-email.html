<!-- Supabase › Authentication › Emails › Change email address. Assunto: Confirme o seu novo e-mail no Arquionie™ -->
<div style="background:#14181E;padding:32px 16px;font-family:Segoe UI,Arial,sans-serif;color:#D4DAE6">
  <div style="max-width:520px;margin:0 auto;background:#1A1F25;padding:28px 28px 24px">
    <p style="margin:0 0 4px;font-size:12px;letter-spacing:4px;color:#9AA6B8">PALHETA</p>
    <p style="margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:2px;color:#FFFFFF">ARQUIONIE™</p>
    <p style="margin:0 0 12px;font-size:16px">Você pediu para trocar o e-mail da conta de <b>{{ .Email }}</b> para <b>{{ .NewEmail }}</b>. Este é o código para confirmar:</p>
    <p style="margin:0 0 16px;font-size:34px;font-weight:700;letter-spacing:10px;color:#FFFFFF">{{ .Token }}</p>
    <p style="margin:0 0 20px;font-size:14px"><a href="{{ .ConfirmationURL }}" style="color:#8FB3D9">Ou confirme por este link</a></p>
    <div style="height:2px;background:#E76353;margin:0 0 14px"></div>
    <p style="margin:0;font-size:12px;color:#9AA6B8">Se não foi você que pediu a troca, escreva para suporte@arquionie.com.br. by Palheta Arquitetura</p>
  </div>
</div>
