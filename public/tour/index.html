<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101317">
<meta name="robots" content="noindex">
<title>Tour</title>
<!--
  O tour no link (ÊDI, 10/10/2026; mockups docs/mockups/tour-no-link.html e tour-imersivo.html, aprovados): o visualizador do
  cliente, nosso, em WebGL 2, sem biblioteca. Lê o pacote do PacoteDoTour (tour.json e os arquivos dele): pelo link /t/CÓDIGO
  (o banco diz onde estão os arquivos), por ?pacote=ENDEREÇO ou da própria pasta. A lógica está em tour.js; o andar, em chao.js.
-->
<style>
  :root { --fundo: #101317; --painel: rgba(17, 21, 26, .72); --texto: #e6e9ee; --apagado: #9aa4b2; --coral: #e76353; --fechado: #794b49; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  canvas#tela { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .sobre { position: absolute; background: var(--painel); color: #fff; }
  button { background: #3a424c; color: var(--texto); border: 0; font: 700 12px "Segoe UI", sans-serif; letter-spacing: .3px; cursor: pointer;
    min-width: 36px; height: 34px; padding: 0 10px; }
  button.forte { background: var(--fechado); color: #fff; }
  button.play { background: var(--coral); color: #fff; min-width: 48px; font-size: 15px; }
  .esconder { display: none !important; }
  #parada { left: calc(10px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); padding: 5px 10px; font-size: 12px; font-weight: 700;
    letter-spacing: .3px; max-width: 60%; }
  #parada span { display: block; font-weight: 400; font-size: 10.5px; color: var(--apagado); letter-spacing: .2px; }
  #mapa { right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); padding: 4px; cursor: pointer; }
  #mapa canvas { display: block; }
  #grande { inset: 0; background: rgba(12, 15, 18, .9); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #grande .cab { display: flex; gap: 8px; align-items: center; font-weight: 700; letter-spacing: .4px; padding: 0 0 8px; }
  #grande canvas { max-width: 94vw; max-height: 76vh; touch-action: none; }
  #controles { left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 4px; background: none; align-items: center; }
  #estado { font-size: 10.5px; color: var(--apagado); background: var(--painel); padding: 3px 8px; margin-left: 6px; white-space: nowrap; }
  #lado { right: calc(10px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 4px; background: none; }
  #retomar { left: 50%; transform: translateX(-50%); bottom: calc(56px + env(safe-area-inset-bottom)); }
  .comando { position: absolute; width: 104px; height: 104px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(17,21,26,.35);
    pointer-events: none; display: none; }
  .comando i { position: absolute; left: 34px; top: 34px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.8); }
  .comando span { position: absolute; left: 0; right: 0; bottom: -17px; text-align: center; font-size: 9.5px; font-weight: 700; letter-spacing: .4px; text-shadow: 0 1px 2px #000; }
  #andar { left: calc(18px + env(safe-area-inset-left)); bottom: calc(64px + env(safe-area-inset-bottom)); }
  #olhar { right: calc(18px + env(safe-area-inset-right)); bottom: calc(64px + env(safe-area-inset-bottom)); }
  body.toque #andar { display: block; }
  body.toque.deitado #olhar { display: block; }
  body.toque.deitado #lado { bottom: auto; top: calc(56px + env(safe-area-inset-top)); }
  #dica { right: calc(12px + env(safe-area-inset-right)); bottom: calc(130px + env(safe-area-inset-bottom)); padding: 4px 8px; font-size: 10px; color: #cfd5de; background: rgba(17,21,26,.55); }
  body:not(.toque) #dica { left: 50%; right: auto; transform: translateX(-50%); top: 12px; bottom: auto; }
  #preto { inset: 0; background: #000; opacity: 0; transition: opacity .35s; pointer-events: none; }
  #chegada { left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 12px 22px; text-align: center; transition: opacity .4s; opacity: 0; pointer-events: none; }
  #chegada span { display: block; font-size: 10.5px; color: var(--apagado); letter-spacing: .5px; font-weight: 700; }
  #chegada b { font-size: 22px; letter-spacing: 1px; font-weight: 600; }
  /* A abertura: o logo do escritório, o projeto, o carregamento e o ENTRAR; o "feito com" só nela. */
  #abertura { position: absolute; inset: 0; background: var(--fundo); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 28px; }
  #abertura img { max-width: 180px; max-height: 70px; margin-bottom: 20px; }
  #abertura .proj { font-size: 15px; font-weight: 700; letter-spacing: .5px; color: #fff; max-width: 340px; }
  #abertura .pas { font-size: 12px; color: var(--apagado); margin: 4px 0 20px; }
  #abertura .barra { width: 180px; height: 3px; background: #2c333c; } #abertura .barra div { width: 0; height: 3px; background: var(--coral); }
  #abertura .q { font-size: 11px; color: var(--apagado); margin-top: 8px; min-height: 16px; }
  #abertura button { margin-top: 16px; height: 42px; padding: 0 34px; font-size: 14px; }
  #abertura .ajuda { font-size: 11px; color: var(--apagado); max-width: 300px; margin-top: 14px; }
  #abertura .feito { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); left: 0; right: 0; font-size: 10px; color: #6b7482; letter-spacing: .5px; }
  #abertura .feito a { color: inherit; text-decoration: none; }
  #aviso { left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; font-size: 12px; display: none; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div class="sobre esconder" id="parada"></div>
<div class="sobre esconder" id="mapa"><canvas id="mapinha"></canvas></div>
<div class="sobre esconder" id="controles">
  <button id="anterior" title="Câmera anterior">⏮</button><button class="play" id="play" title="Reproduzir">▶</button><button id="proxima" title="Próxima câmera">⏭</button>
  <span id="estado"></span>
</div>
<div class="sobre esconder" id="lado"><button id="giro">MOVIMENTO DO CELULAR</button><button id="telaCheia">TELA CHEIA</button></div>
<button class="sobre forte esconder" id="retomar">▶ RETOMAR O PASSEIO</button>
<div class="comando" id="andar"><i></i><span>ANDAR</span></div>
<div class="comando" id="olhar"><i></i><span>OLHAR</span></div>
<div class="sobre esconder" id="dica"></div>
<div class="sobre" id="chegada"><span></span><b></b></div>
<div class="sobre esconder" id="grande"><div class="cab"><button id="pisoAbaixo">◀</button><span id="nomeDoPiso"></span><button id="pisoAcima">▶</button><button id="fecharMapa">FECHAR</button></div><canvas id="mapaGrande"></canvas></div>
<div class="sobre" id="preto"></div>
<div class="sobre" id="aviso"></div>
<div id="abertura">
  <img id="logo" alt="" class="esconder">
  <div class="proj" id="projeto">Carregando o tour…</div>
  <div class="pas" id="passeio"></div>
  <div class="barra"><div id="barra"></div></div>
  <div class="q" id="carga"></div>
  <button class="forte esconder" id="entrar">ENTRAR</button>
  <div class="ajuda" id="ajuda"></div>
  <div class="feito"><a href="https://www.arquionie.com.br" target="_blank" rel="noreferrer">feito com ARQUIONIE™</a></div>
</div>
<script>
  // No site, a página vem de /t/CÓDIGO e os scripts moram em /tour/; na pasta do pacote, ao lado.
  for (const nome of ["chao.js", "tour.js"]) {
    const s = document.createElement("script");
    s.src = (location.pathname.startsWith("/t/") ? "/tour/" : "") + nome; s.async = false;
    document.head.appendChild(s);
  }
</script>
</body>
</html>
