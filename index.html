<!doctype html>
<html lang="pt-BR" data-tema="claro" data-modo="amigavel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:inicio — o build troca este trecho pelo de cada página (ferramentas/gerar-paginas.mjs) -->
    <title>Arquionie™ · Programa BIM e CRM para escritórios de arquitetura</title>
    <meta name="description" content="Programa BIM brasileiro com renderizador próprio, apresentação ao cliente por link e CRM: do primeiro contato ao projeto aprovado. Grátis, com versão PRO." />
    <!-- seo:fim -->
    <script>
      // A aparência guardada no navegador antes do primeiro desenho (lib/aparencia.js).
      try {
        var tema = localStorage.getItem('arquionie-aparencia');
        if (tema === 'escuro' || tema === 'auto') document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
    <!-- O leão enchendo o quadrado, sem transparência: o Google desenha o ícone cheio no círculo dele, sem o anel branco
         (ÊDI, 22/10/2026). Em múltiplos de 48 px, como o Google pede. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icone-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/marca-256.png" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
